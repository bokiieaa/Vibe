<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN WebRTC Live Stream</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-6">

    <!-- Header -->
    <header class="w-full max-w-4xl flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
        <h1 class="text-xl font-bold tracking-tight text-purple-400">LAN Broadcast Hub</h1>
        <button id="open-modal-btn" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition-colors">
            Go Live
        </button>
    </header>

    <!-- Main Video Player -->
    <main class="w-full max-w-4xl bg-slate-900 rounded-xl overflow-hidden shadow-2xl border border-slate-800 relative">
        <video id="stream-video" autoplay playsinline controls class="w-full aspect-video bg-black object-contain"></video>
        <div id="status-badge" class="absolute top-4 left-4 bg-red-600/80 text-white text-xs px-2.5 py-1 rounded-full font-semibold uppercase tracking-wider backdrop-blur-sm hidden">
            Live
        </div>
    </main>

    <!-- Modal for Broadcast Settings -->
    <div id="stream-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center hidden z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 w-full max-w-md space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h2 class="text-sm font-bold text-slate-200">Broadcast Setup (Local Wi-Fi Only)</h2>
                <button id="close-modal-btn" class="text-slate-400 hover:text-white text-sm">✕</button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase">Stream Title</label>
                    <input type="text" id="broadcast-title-input" placeholder="e.g. Local Gaming Stream" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-purple-500">
                </div>
                
                <!-- Audio / Video Options -->
                <div class="space-y-2 pt-1 border-t border-slate-800/60 mt-3">
                    <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-300">
                        <input type="checkbox" id="mic-toggle" checked class="rounded border-slate-800 bg-slate-950 text-purple-600 focus:ring-purple-500">
                        <span>🎙️ Enable Microphone Voiceover</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-300">
                        <input type="checkbox" id="camera-corner-toggle" class="rounded border-slate-800 bg-slate-950 text-purple-600 focus:ring-purple-500">
                        <span>📷 Add Camera in Corner (PiP)</span>
                    </label>
                </div>

                <div class="flex gap-2 pt-2">
                    <button id="start-broadcast-btn" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold py-2.5 rounded-lg transition-colors">Start Live Stream</button>
                    <button id="stop-broadcast-btn" class="hidden flex-1 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold py-2.5 rounded-lg transition-colors">End Stream</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Supabase Initialization ---
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const currentUser = { username: 'User_' + Math.floor(Math.random() * 1000) };
        const signalChannel = supabaseClient.channel('webrtc_signaling');
        signalChannel.subscribe();

        // --- LAN WebRTC Configuration ---
        // Empty iceServers enforces local network host candidates only (no public STUN/TURN)
        const localRtcConfig = {
            iceServers: [],
            iceTransportPolicy: 'all'
        };

        let localStream = null;
        const peerConnections = {};
        const streamVideo = document.getElementById('stream-video');
        const statusBadge = document.getElementById('status-badge');

        // Check if candidate is restricted to host / LAN interfaces
        function isLocalCandidate(candidate) {
            if (!candidate || !candidate.candidate) return false;
            const c = candidate.candidate;
            return c.includes('typ host') || c.includes('192.168.') || c.includes('10.') || c.includes('172.');
        }

        // --- Modal UI Controls ---
        const modal = document.getElementById('stream-modal');
        document.getElementById('open-modal-btn').onclick = () => modal.classList.remove('hidden');
        document.getElementById('close-modal-btn').onclick = () => modal.classList.add('hidden');

        // --- Start Broadcast Logic ---
        document.getElementById('start-broadcast-btn').onclick = async () => {
            const title = document.getElementById('broadcast-title-input').value.trim() || `${currentUser.username}'s Stream`;
            const includeMic = document.getElementById('mic-toggle').checked;
            const includeCamCorner = document.getElementById('camera-corner-toggle').checked;

            try {
                // 1. Capture Screen Display
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                let finalStream = new MediaStream();

                // 2. Audio Mixing (Mic + System Audio)
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const dest = audioCtx.createMediaStreamDestination();

                if (screenStream.getAudioTracks().length > 0) {
                    const systemSource = audioCtx.createMediaStreamSource(new MediaStream([screenStream.getAudioTracks()[0]]));
                    systemSource.connect(dest);
                }

                if (includeMic) {
                    const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const micSource = audioCtx.createMediaStreamSource(micStream);
                    micSource.connect(dest);
                }

                dest.stream.getAudioTracks().forEach(track => finalStream.addTrack(track));

                // 3. Camera Picture-in-Picture or Direct Video
                if (includeCamCorner) {
                    const camStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    const screenVideoElem = document.createElement('video');
                    screenVideoElem.srcObject = screenStream;
                    screenVideoElem.muted = true;
                    await screenVideoElem.play();

                    const camVideoElem = document.createElement('video');
                    camVideoElem.srcObject = camStream;
                    camVideoElem.muted = true;
                    await camVideoElem.play();

                    canvas.width = screenVideoElem.videoWidth || 1280;
                    canvas.height = screenVideoElem.videoHeight || 720;

                    function drawFrame() {
                        if (!localStream) return;
                        ctx.drawImage(screenVideoElem, 0, 0, canvas.width, canvas.height);

                        const camW = canvas.width * 0.22;
                        const camH = camW * (3 / 4);
                        const margin = 20;
                        ctx.drawImage(camVideoElem, canvas.width - camW - margin, canvas.height - camH - margin, camW, camH);

                        requestAnimationFrame(drawFrame);
                    }
                    drawFrame();

                    const canvasStream = canvas.captureStream(30);
                    canvasStream.getVideoTracks().forEach(track => finalStream.addTrack(track));
                } else {
                    screenStream.getVideoTracks().forEach(track => finalStream.addTrack(track));
                }

                localStream = finalStream;
                streamVideo.srcObject = localStream;
                statusBadge.classList.remove('hidden');

                // Save status in DB
                await supabaseClient.from('streams').upsert({
                    username: currentUser.username,
                    title: title,
                    is_live: true
                }, { onConflict: 'username' });

                // Multi-peer signaling
                signalChannel.on('broadcast', { event: 'signal' }, async ({ payload }) => {
                    if (payload.target === currentUser.username && payload.type === 'join_request') {
                        const viewer = payload.sender;
                        const pc = new RTCPeerConnection(localRtcConfig);
                        peerConnections[viewer] = pc;

                        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                        pc.onicecandidate = (e) => {
                            if (e.candidate && isLocalCandidate(e.candidate)) {
                                signalChannel.send({
                                    type: 'broadcast',
                                    event: 'signal',
                                    payload: { target: viewer, sender: currentUser.username, type: 'candidate', candidate: e.candidate }
                                });
                            }
                        };

                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);

                        signalChannel.send({
                            type: 'broadcast',
                            event: 'signal',
                            payload: { target: viewer, sender: currentUser.username, type: 'offer', offer: offer }
                        });
                    }
                });

                document.getElementById('start-broadcast-btn').classList.add('hidden');
                document.getElementById('stop-broadcast-btn').classList.remove('hidden');
                modal.classList.add('hidden');

            } catch (err) {
                alert("Could not start broadcast: " + err.message);
            }
        };

        // --- Stop Broadcast Logic ---
        document.getElementById('stop-broadcast-btn').onclick = async () => {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            streamVideo.srcObject = null;
            statusBadge.classList.add('hidden');

            Object.values(peerConnections).forEach(pc => pc.close());

            await supabaseClient.from('streams').update({ is_live: false }).eq('username', currentUser.username);

            document.getElementById('start-broadcast-btn').classList.remove('hidden');
            document.getElementById('stop-broadcast-btn').classList.add('hidden');
        };
    </script>
</body>
</html>
